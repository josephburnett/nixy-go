<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nixy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- No <input> anywhere, so phones never pop up their own keyboard:
         the on-screen keyboard is the input. -->
    <div id="terminal"></div>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("nixy.wasm"), go.importObject).then(result => {
            go.run(result.instance);

            const container = document.getElementById("terminal");
            container.innerHTML = nixyInit();

            function show(html) {
                if (html) {
                    container.innerHTML = html;
                }
            }

            // Measure one character cell using the same styles the
            // terminal renders with (font and line-height come from the
            // container's <pre>), averaged over a block to avoid rounding.
            function measureCell() {
                const pre = document.createElement("pre");
                pre.style.position = "absolute";
                pre.style.visibility = "hidden";
                pre.textContent = ("M".repeat(10) + "\n").repeat(10);
                container.appendChild(pre);
                const rect = pre.getBoundingClientRect();
                container.removeChild(pre);
                return { w: rect.width / 10, h: rect.height / 10 };
            }

            function updateSize() {
                const cell = measureCell();
                const style = getComputedStyle(container);
                const w = container.clientWidth
                    - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
                const h = container.clientHeight
                    - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
                show(nixyResize(Math.floor(w / cell.w), Math.floor(h / cell.h)));
            }

            // Typed keys.
            document.addEventListener("keydown", e => {
                // Ctrl+\ dumps the snapshot ring to a downloadable file.
                if (e.ctrlKey && (e.key === "\\" || e.code === "Backslash")) {
                    const dump = nixyDumpState();
                    const blob = new Blob([dump], { type: "text/plain" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    const ts = new Date().toISOString().replace(/[:.]/g, "-");
                    a.download = `nixy-debug-${ts}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                    e.preventDefault();
                    return;
                }
                if (e.ctrlKey || e.altKey || e.metaKey) {
                    return;
                }
                // Only swallow keys the game uses, so Tab, F5, F12 etc.
                // keep working.
                if (e.key !== "Enter" && e.key !== "Backspace" && [...e.key].length !== 1) {
                    return;
                }
                show(nixyKeystroke(e.key));
                e.preventDefault();
            });

            // Tapped / clicked keys. Only keys that are valid right now
            // carry data-key, so dim keys do nothing. pointerdown (not
            // click) so taps respond immediately and don't select text.
            container.addEventListener("pointerdown", e => {
                const key = e.target.closest("[data-key]");
                if (!key) {
                    return;
                }
                e.preventDefault();
                show(nixyKeystroke(key.dataset.key));
            });

            new ResizeObserver(() => updateSize()).observe(container);
        });
    </script>
</body>
</html>
